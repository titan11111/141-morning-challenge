<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a38"/>
      <stop offset="100%" stop-color="#050c1a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90c8"/>
      <stop offset="100%" stop-color="#1a4a7a"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="100%" stop-color="#cc1111"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  <!-- Sky glow -->
  <ellipse cx="256" cy="120" rx="200" ry="90" fill="rgba(72,140,255,0.18)"/>
  <!-- Road trapezoid -->
  <polygon points="80,380 432,380 340,240 172,240" fill="#3a3a48"/>
  <polygon points="80,380 432,380 340,240 172,240" fill="url(#road)" opacity="0.35"/>
  <!-- Center line -->
  <polygon points="240,380 272,380 264,240 248,240" fill="rgba(255,255,255,0.55)"/>
  <!-- Car body -->
  <polygon points="180,360 332,360 318,296 194,296" fill="url(#car)"/>
  <!-- Car roof -->
  <polygon points="210,296 302,296 290,258 222,258" fill="#ff3333"/>
  <polygon points="222,296 290,296 280,260 232,260" fill="rgba(180,230,255,0.7)"/>
  <!-- Rear wing -->
  <rect x="172" y="244" width="168" height="14" rx="4" fill="#1a1a1a"/>
  <!-- Tail lights -->
  <rect x="180" y="320" width="36" height="18" rx="4" fill="#ff2200"/>
  <rect x="296" y="320" width="36" height="18" rx="4" fill="#ff2200"/>
  <!-- Exhaust flame -->
  <ellipse cx="214" cy="370" rx="10" ry="16" fill="rgba(255,160,30,0.85)"/>
  <ellipse cx="298" cy="370" rx="10" ry="16" fill="rgba(255,160,30,0.85)"/>
  <!-- Title text -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="42" font-weight="900" fill="#7ee0ff"
        letter-spacing="2">NEON</text>
  <text x="256" y="490" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="28" font-weight="900" fill="rgba(200,230,255,0.7)"
        letter-spacing="4">RIDGE</text>
</svg>
